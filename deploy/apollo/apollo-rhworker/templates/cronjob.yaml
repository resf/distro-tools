{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "apollo-rhworker.fullname" . }}
  labels:
    {{- include "apollo-rhworker.labels" . | nindent 4 }}
spec:
  schedule: '{{ .Values.cron.schedule }}'
  # Set explicitly so an upgrade also clears a manual `kubectl patch` suspend.
  suspend: {{ .Values.cron.suspend | default false }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Every retried pod would start another run.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          serviceAccountName: {{ include "apollo-rhworker.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | indent 8 }}
          # The pod only starts the workflow; it doesn't wait for the run.
          activeDeadlineSeconds: 300
          containers:
          - name: {{ .Chart.Name }}-poll-rh-advisories-workflow
            image: temporalio/admin-tools:1.10.5
            securityContext:
              {{- toYaml .Values.securityContext | indent 12 }}
            env:
              - name: TEMPORAL_CLI_ADDRESS
                value: workflow-temporal-frontend.workflow.svc.cluster.local:7233
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
            - |
              {{- range $cmd := $.Values.cron.preCommand }}
              {{ $cmd }}
              {{- end }}
              # A fixed workflow ID means at most one cron-started run is open at a time.
              out=$(tctl wf start --tq v2-rhworker --wt PollRHCSAFAdvisoriesWorkflow --wid {{ .Values.cron.workflowId | default "poll-rhcsaf-cron" }} 2>&1)
              rc=$?
              echo "$out"
              if [ "$rc" -ne 0 ]; then
                if echo "$out" | grep -q "code = AlreadyExists"; then
                  echo "Previous {{ .Values.cron.workflowId | default "poll-rhcsaf-cron" }} run is still open; skipping."
                else
                  exit "$rc"
                fi
              fi
              {{- range $cmd := $.Values.cron.postCommand }}
              {{ $cmd }}
              {{- end }}
{{- end }}
