# Default values for apollo-rpmworker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/resf/apollo-rpmworker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1463c15"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

database:
  host: resf-peridot-dev.ctxqgglmfofx.us-east-2.rds.amazonaws.com
  user: apollo2production
  password:
    valueFrom:
      secretKeyRef:
        name: db
        key: password

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # Measured on a production snapshot with full-size 8 / 9.8 / 10.2 repos: the matcher
  # runs one major per activity and peaks at 10.3 GiB (EL10; EL9 10.0, EL8 6.3). The
  # request lets the scheduler place the worker on a node with room for it (it was
  # BestEffort and evicted first under node memory pressure); the limit keeps an
  # overrun inside this pod instead of starving the node.
  requests:
    memory: 12Gi
  limits:
    memory: 14Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

cron:
  enabled: true
  suspend: false
  schedule: "0 */6 * * *"
  # Fixed so a new cron run is skipped while the previous one is still open.
  workflowId: rh-matcher-cron
  majorVersions: []
  preCommand:
    - trap 'curl --max-time 2 -s -f -XPOST http://127.0.0.1:15020/quitquitquit' EXIT
    - while ! curl -s -f http://127.0.0.1:15020/healthz/ready; do sleep 1; done
    - echo "Ready!"
  postCommand:
    - echo "Complete!"

# Apollo images are built for amd64 only.
nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []

affinity: {}
